name: detection-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate rules and replay fixtures
        run: python -m sigma_lab.cli
      - name: Unit tests
        run: pytest -q
