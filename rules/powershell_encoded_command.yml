title: Suspicious Encoded PowerShell Command Line
id: 6f1c9b1e-2a7d-4c55-9e0a-5d3b8a1f0c01
status: experimental
description: Detects PowerShell launched with an encoded command argument, a common way to hide payloads.
author: Donn Gordon
date: 2026/10/05
references:
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate administration scripts
  - Software deployment and configuration management tools
level: medium
tags:
  - attack.execution
  - attack.t1059.001
